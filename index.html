<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>裝備鑑定所 · Gear Loadout Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140F;
    --bg-raised: #1F1B14;
    --bg-card: #241F17;
    --line: #3A3223;
    --line-soft: #2A251A;
    --text: #EDE3D3;
    --text-dim: #A99A80;
    --text-faint: #6E6250;
    --ember: #E8743B;
    --ember-dim: #B8552A;
    --brass: #C79A4B;
    --good: #6EDE5D;
    --warn: #FFC93C;
    --bad: #E85A5A;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,116,59,0.07), transparent 60%),
      radial-gradient(ellipse 700px 400px at 90% 10%, rgba(199,154,75,0.05), transparent 60%);
    color: var(--text);
    font-family: 'Spectral', Georgia, serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header{ padding: 28px 16px 20px; border-bottom: 1px solid var(--line); }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--brass); margin: 0 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:16px; height:1px; background: var(--brass); display:inline-block; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:28px; margin:0 0 8px; line-height:1.15; }
  h1 em{ font-style:normal; color: var(--ember); }
  .sub{ font-size:14.5px; color: var(--text-dim); line-height:1.6; margin:0; max-width:52ch; }

  .search-block{
    padding: 18px 16px 0; position: sticky; top: 0;
    background: linear-gradient(var(--bg) 82%, transparent); z-index: 10; padding-bottom: 14px;
  }
  .search-plate{
    position: relative; border: 1px solid var(--line); background: var(--bg-raised);
    border-radius: 3px; display:flex; align-items:center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .search-plate::before{
    content:''; width: 6px; align-self:stretch;
    background: linear-gradient(180deg, var(--ember), var(--ember-dim)); border-radius: 3px 0 0 3px;
  }
  #search{
    flex:1; background: transparent; border: none; outline: none; color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 15.5px; padding: 14px 12px; letter-spacing: 0.01em;
  }
  #search::placeholder{ color: var(--text-faint); }
  .clear-btn{
    background:none; border:none; color: var(--text-faint); font-family:'IBM Plex Mono',monospace;
    font-size:18px; padding: 8px 14px; cursor:pointer; line-height:1; display:none;
  }
  .clear-btn.show{ display:block; }
  .clear-btn:active{ color: var(--ember); }
  .stat-line{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color: var(--text-faint); margin-top:10px; }
  .stat-line b{ color: var(--brass); font-weight:500; }
  .suggest{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:5px 10px; border:1px solid var(--line);
    border-radius:20px; color:var(--text-dim); background: var(--bg-raised); cursor:pointer;
  }
  .chip:active{ border-color: var(--ember); color: var(--ember); }

  main{ padding: 8px 16px 0; }
  .empty-state{ text-align:center; padding: 60px 20px 30px; color: var(--text-faint); }
  .empty-state .glyph{ font-size:34px; margin-bottom:14px; opacity:0.5; }
  .empty-state p{ font-family:'Spectral',serif; font-size:14.5px; line-height:1.7; max-width:34ch; margin:0 auto; }

  .verdict{
    border-radius: 4px; padding: 16px 16px; margin: 16px 0 12px; border: 1px solid var(--line-soft);
  }
  .verdict.best{ background: rgba(110,222,93,0.08); border-color: rgba(110,222,93,0.3); }
  .verdict.warn{ background: rgba(255,201,60,0.08); border-color: rgba(255,201,60,0.3); }
  .verdict.neutral{ background: var(--bg-card); }
  .verdict-title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .verdict.best .verdict-title{ color: var(--good); }
  .verdict.warn .verdict-title{ color: var(--warn); }
  .verdict-body{ font-size:14px; color: var(--text-dim); line-height:1.7; }
  .verdict-body b{ color: var(--text); font-weight:600; }

  .item-header{
    display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 10px;
    padding-bottom:8px; border-bottom:1px solid var(--line-soft);
  }
  .item-name{ font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; color: var(--text); }
  .item-meta{ font-family:'IBM Plex Mono',monospace; font-size:12px; color: var(--text-faint); }

  .stat-row{
    display:flex; gap:10px; margin: 10px 0 16px; flex-wrap: wrap;
  }
  .stat-pill{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color: var(--text-dim);
    background: var(--bg-raised); border:1px solid var(--line-soft); border-radius:4px; padding:6px 10px;
  }
  .stat-pill b{ color: var(--brass); }

  .used-by-list{ margin: 6px 0 16px; }
  .used-by-item{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color: var(--text-dim);
    padding: 6px 0; border-bottom: 1px dashed var(--line-soft);
  }
  .used-by-item b{ color: var(--good); font-weight:600; }

  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-faint); margin: 18px 0 8px;
  }

  .card{
    background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 4px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .card-name{ font-family:'Oswald',sans-serif; font-size:14.5px; font-weight:500; color: var(--text); }
  .card-stats{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color: var(--text-faint); }
  .card-used{ font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--text-dim); line-height:1.6; }
  .card-used b{ color: var(--brass); font-weight:500; }

  .no-match{ font-family:'IBM Plex Mono',monospace; font-size:13px; color: var(--text-faint); padding:10px 2px 20px; line-height:1.7; }

  footer{ margin-top:40px; padding:18px 16px 0; border-top:1px solid var(--line-soft); }
  footer p{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color: var(--text-faint); line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Shop Titans · Levelling Gear × Blueprints</p>
    <h1>裝備<em>鑑定所</em></h1>
    <p class="sub">輸入一件裝備，查它是否屬於某職業的最適合練等裝備；若不是，比對同類型、同 Tier 的推薦裝備數值。</p>
  </header>

  <div class="search-block">
    <div class="search-plate">
      <input id="search" type="text" placeholder="輸入裝備名稱，例如 Zweihander…" autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn">×</button>
    </div>
    <div class="stat-line" id="statLine"></div>
    <div class="suggest" id="suggest"></div>
  </div>

  <main id="main">
    <div class="empty-state" id="emptyState">
      <div class="glyph">⚔</div>
      <p>輸入裝備名稱（英文，大小寫不拘），查詢它是否為某職業練等時的最適合裝備。</p>
    </div>
    <div id="results"></div>
  </main>

  <footer>
    <p>資料來源：Blueprints (ATK/DEF/HP/Antique) + Tl;dr Heroes Levelling Gear Loadouts (Tier 1–15)<br>
    「較新裝備」標註：Antique 開放日期在 2026 年以後，攻略表格最後更新於 2026-05/06，可能尚未收錄</p>
  </footer>
</div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('ledger-data').textContent);
  const BP = DATA.blueprints;
  const LOADOUT = DATA.loadout_index;
  const POOL = DATA.pool;

  // case-insensitive name index
  const nameIndex = {};
  Object.keys(BP).forEach(n => { nameIndex[n.toLowerCase()] = n; });

  const totalItems = Object.keys(BP).length;
  const totalBIS = Object.keys(LOADOUT).length;
  document.getElementById('statLine').innerHTML =
    `資料庫共 <b>${totalItems}</b> 件裝備，其中 <b>${totalBIS}</b> 件是某職業的最適合練等裝備`;

  const starters = ['Zweihander', 'Iron Pine Cone', 'Cutlass', "Hero's Sword"].filter(s => nameIndex[s.toLowerCase()]);
  const suggestEl = document.getElementById('suggest');
  suggestEl.innerHTML = starters.map(s => `<span class="chip" data-q="${s}">${s}</span>`).join('');
  suggestEl.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if(!chip) return;
    searchEl.value = chip.dataset.q;
    runSearch(chip.dataset.q);
  });

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function statPills(info){
    const pills = [];
    pills.push(`<span class="stat-pill">Tier <b>${info.tier ?? '–'}</b></span>`);
    pills.push(`<span class="stat-pill">${esc(info.type ?? '–')}</span>`);
    if(info.atk != null) pills.push(`<span class="stat-pill">ATK <b>${info.atk}</b></span>`);
    if(info.def != null) pills.push(`<span class="stat-pill">DEF <b>${info.def}</b></span>`);
    if(info.hp != null) pills.push(`<span class="stat-pill">HP <b>${info.hp}</b></span>`);
    if(info.antique) pills.push(`<span class="stat-pill">Antique <b>${esc(info.antique)}</b></span>`);
    else pills.push(`<span class="stat-pill">Antique <b>尚未開放</b></span>`);
    return pills.join('');
  }

  function isNewItem(info){
    if(!info.antique) return false;
    return info.antique >= '2026-01-01';
  }

  function renderBIS(name, info, uses){
    const usesSorted = uses.slice().sort((a,b) => a.tier - b.tier || a.class.localeCompare(b.class));
    const usesHtml = usesSorted.map(u => `<div class="used-by-item"><b>${esc(u.class)}</b> — Tier ${u.tier}</div>`).join('');
    return `
      <div class="verdict best">
        <div class="verdict-title">✓ 這是最適合練等裝備</div>
        <div class="verdict-body">在 <b>${usesSorted.length}</b> 個職業 Tier 中被列為最適合裝備。</div>
      </div>
      <div class="item-header">
        <span class="item-name">${esc(name)}</span>
        <span class="item-meta">Tier ${info.tier ?? '–'} · ${esc(info.type ?? '')}</span>
      </div>
      <div class="stat-row">${statPills(info)}</div>
      <div class="section-label">被以下職業 / Tier 採用</div>
      <div class="used-by-list">${usesHtml}</div>
    `;
  }

  function renderNonBIS(name, info){
    const newFlag = isNewItem(info);
    let verdictHtml;
    if(newFlag){
      verdictHtml = `
        <div class="verdict warn">
          <div class="verdict-title">⚠ 不在推薦清單中 — 可能是較新裝備</div>
          <div class="verdict-body">此裝備開放為 Antique 的日期是 <b>${esc(info.antique)}</b>，攻略表格最後更新於 2026 年 5–6 月，這件裝備有可能是尚未被收錄評估的新裝備，而不是真的不夠好。</div>
        </div>
      `;
    } else {
      verdictHtml = `
        <div class="verdict neutral">
          <div class="verdict-title" style="color:var(--text-dim)">✕ 不是任何職業的最適合練等裝備</div>
          <div class="verdict-body">下方列出同類型、同 Tier 的推薦裝備數值，供你比較。</div>
        </div>
      `;
    }

    const header = `
      <div class="item-header">
        <span class="item-name">${esc(name)}</span>
        <span class="item-meta">Tier ${info.tier ?? '–'} · ${esc(info.type ?? '')}</span>
      </div>
      <div class="stat-row">${statPills(info)}</div>
    `;

    // find candidates: same type + same tier, drawn from BIS pool
    const key = `${info.type}|${info.tier}`;
    const candidates = (POOL[key] || []).filter(n => n !== name);
    let compareHtml = '';
    if(candidates.length){
      compareHtml = `<div class="section-label">同類型 · 同 Tier 的推薦裝備</div>` +
        candidates.map(cname => {
          const cinfo = BP[cname];
          const uses = LOADOUT[cname] || [];
          const usesStr = uses.slice(0,4).map(u => `${esc(u.class)} T${u.tier}`).join(', ') + (uses.length > 4 ? ` +${uses.length-4}` : '');
          const statsStr = [
            cinfo.atk != null ? `ATK ${cinfo.atk}` : null,
            cinfo.def != null ? `DEF ${cinfo.def}` : null,
            cinfo.hp != null ? `HP ${cinfo.hp}` : null
          ].filter(Boolean).join(' · ');
          return `
            <div class="card">
              <div class="card-top">
                <span class="card-name">${esc(cname)}</span>
                <span class="card-stats">${statsStr}</span>
              </div>
              <div class="card-used">採用於：<b>${usesStr || '—'}</b></div>
            </div>
          `;
        }).join('');
    } else {
      compareHtml = `<div class="no-match">找不到同類型、同 Tier 的推薦裝備可供比較。</div>`;
    }

    return verdictHtml + header + compareHtml;
  }

  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('emptyState');
  const clearBtn = document.getElementById('clearBtn');

  function runSearch(qRaw){
    const q = qRaw.trim();
    clearBtn.classList.toggle('show', q.length > 0);
    if(!q){ resultsEl.innerHTML = ''; emptyEl.style.display = 'block'; return; }
    emptyEl.style.display = 'none';

    const exact = nameIndex[q.toLowerCase()];
    if(exact){
      const info = BP[exact];
      const uses = LOADOUT[exact];
      resultsEl.innerHTML = uses ? renderBIS(exact, info, uses) : renderNonBIS(exact, info);
      return;
    }
    // fuzzy: substring match against all names
    const ql = q.toLowerCase();
    const matches = Object.keys(BP).filter(n => n.toLowerCase().includes(ql)).slice(0, 15);
    if(matches.length === 0){
      resultsEl.innerHTML = `<div class="no-match">資料庫中查無「${esc(qRaw)}」，請確認英文拼字。</div>`;
      return;
    }
    if(matches.length === 1){
      const exact2 = matches[0];
      const info = BP[exact2];
      const uses = LOADOUT[exact2];
      resultsEl.innerHTML = uses ? renderBIS(exact2, info, uses) : renderNonBIS(exact2, info);
      return;
    }
    resultsEl.innerHTML = `<div class="section-label">找到 ${matches.length} 個符合的裝備，請選擇：</div>` +
      matches.map(n => `<div class="card" style="cursor:pointer" data-pick="${esc(n)}"><div class="card-top"><span class="card-name">${esc(n)}</span><span class="card-stats">Tier ${BP[n].tier ?? '–'} · ${esc(BP[n].type ?? '')}</span></div></div>`).join('');
  }

  resultsEl.addEventListener('click', e => {
    const card = e.target.closest('[data-pick]');
    if(!card) return;
    searchEl.value = card.dataset.pick;
    runSearch(card.dataset.pick);
  });

  let debounceId;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounceId);
    debounceId = setTimeout(() => runSearch(searchEl.value), 90);
  });
  clearBtn.addEventListener('click', () => { searchEl.value=''; runSearch(''); searchEl.focus(); });
})();
</script>
</body>
</html>

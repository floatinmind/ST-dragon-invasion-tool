<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>貨艙清點表 · Dragon Invasion Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140F;
    --bg-raised: #1F1B14;
    --bg-card: #241F17;
    --line: #3A3223;
    --line-soft: #2A251A;
    --text: #EDE3D3;
    --text-dim: #A99A80;
    --text-faint: #6E6250;
    --ember: #E8743B;
    --ember-dim: #B8552A;
    --brass: #C79A4B;
    --good: #6EDE5D;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,116,59,0.07), transparent 60%),
      radial-gradient(ellipse 700px 400px at 90% 10%, rgba(199,154,75,0.05), transparent 60%);
    color: var(--text);
    font-family: 'Spectral', Georgia, serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header{ padding: 28px 16px 20px; border-bottom: 1px solid var(--line); }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color: var(--brass); margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:16px; height:1px; background: var(--brass); display:inline-block; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:26px; margin:0 0 8px; line-height:1.15; }
  h1 em{ font-style:normal; color: var(--ember); }
  .sub{ font-size:14px; color: var(--text-dim); line-height:1.6; margin:0; max-width:52ch; }

  main{ padding: 16px 16px 0; }

  .cat-section{
    border: 1px solid var(--line-soft); border-radius: 4px; margin-bottom: 12px; overflow: hidden;
    background: var(--bg-card);
  }
  .cat-head{
    display:flex; justify-content:space-between; align-items:center; padding: 14px 16px;
    cursor: pointer; user-select: none; background: var(--bg-raised);
  }
  .cat-name{ font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; color: var(--text); }
  .cat-progress{
    display:flex; align-items:center; gap:10px;
  }
  .cat-count{ font-family:'IBM Plex Mono',monospace; font-size:13px; color: var(--text-dim); }
  .cat-count b{ color: var(--ember); font-weight:600; }
  .cat-count.done b{ color: var(--good); }
  .cat-bar{
    width: 60px; height: 5px; border-radius: 3px; background: var(--line-soft); overflow:hidden;
  }
  .cat-bar-fill{ height:100%; background: linear-gradient(90deg, var(--ember-dim), var(--ember)); border-radius:3px; transition: width 0.2s; }
  .cat-bar-fill.done{ background: linear-gradient(90deg, #4A9E3F, var(--good)); }
  .chevron{ font-family:'IBM Plex Mono',monospace; color: var(--text-faint); font-size:12px; margin-left:8px; transition: transform 0.15s; }
  .chevron.open{ transform: rotate(90deg); }

  .cat-body{ display:none; }
  .cat-body.open{ display:block; }

  .item-row{
    display:grid; grid-template-columns: 1fr repeat(5, 34px); gap:4px; align-items:center;
    padding: 8px 14px; border-top: 1px dashed var(--line-soft);
  }
  .item-row.active{ background: rgba(110,222,93,0.05); }
  .item-info{ min-width:0; }
  .item-name{
    font-family:'Oswald',sans-serif; font-size:13px; color: var(--text); font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item-rank{ font-family:'IBM Plex Mono',monospace; font-size:10px; color: var(--text-faint); }
  .qty-input{
    width:100%; background: var(--bg-raised); border:1px solid var(--line); border-radius:3px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 2px; text-align:center;
  }
  .qty-input.q-Normal{ color:#E4E1DA; }
  .qty-input.q-Superior{ color:#6EDE5D; }
  .qty-input.q-Flawless{ color:#4DD2E8; }
  .qty-input.q-Epic{ color:#B266FF; }
  .qty-input.q-Legendary{ color:#FFC93C; }
  .qty-input:focus{ outline:none; border-color: var(--ember); }

  .col-labels{
    display:grid; grid-template-columns: 1fr repeat(5, 34px); gap:4px; padding: 6px 14px 4px;
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.02em;
    color: var(--text-faint); text-align:center;
  }
  .col-labels span:first-child{ text-align:left; }
  .col-labels .cl-Normal{ color:#E4E1DA; }
  .col-labels .cl-Superior{ color:#6EDE5D; }
  .col-labels .cl-Flawless{ color:#4DD2E8; }
  .col-labels .cl-Epic{ color:#B266FF; }
  .col-labels .cl-Legendary{ color:#FFC93C; }

  footer{ margin-top:32px; padding:18px 16px 0; border-top:1px solid var(--line-soft); }
  footer p{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color: var(--text-faint); line-height:1.8; }
</style>
</head>

</div>

<script>
(function(){
  const TOP50 = JSON.parse(document.getElementById('ledger-data').textContent);
  const CATS = ['Weapons', 'Body Armor', 'Misc. Armor', 'Accessory'];
  const QUALITIES = ['Normal','Superior','Flawless','Epic','Legendary'];

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const main = document.getElementById('main');

  CATS.forEach((cat, catIdx) => {
    const items = TOP50[cat] || [];
    const section = document.createElement('div');
    section.className = 'cat-section';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <span class="cat-name">${esc(cat)}</span>
      <span class="cat-progress">
        <span class="cat-bar"><span class="cat-bar-fill" id="bar-${catIdx}" style="width:0%"></span></span>
        <span class="cat-count" id="count-${catIdx}"><b>0</b> / ${items.length}</span>
        <span class="chevron" id="chev-${catIdx}">›</span>
      </span>
    `;
    section.appendChild(head);

    const body = document.createElement('div');
    body.className = 'cat-body';
    if(catIdx === 0) body.classList.add('open');

    const colLabels = document.createElement('div');
    colLabels.className = 'col-labels';
    colLabels.innerHTML = `<span>裝備</span>` + QUALITIES.map(q => `<span class="cl-${q}">${q.slice(0,4)}</span>`).join('');
    body.appendChild(colLabels);

    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      const qtyInputs = QUALITIES.map(q => `<input type="number" class="qty-input q-${q}" id="qty-${catIdx}-${i}-${q}" value="0" min="0">`).join('');
      row.innerHTML = `
        <div class="item-info">
          <div class="item-name">${esc(it.name)}</div>
          <div class="item-rank">#${it.rank} · AP ${it.ap}</div>
        </div>
        ${qtyInputs}
      `;
      body.appendChild(row);

      QUALITIES.forEach(q => {
        const inp = row.querySelector(`#qty-${catIdx}-${i}-${q}`);
        inp.addEventListener('input', () => {
          const total = QUALITIES.reduce((sum, qq) => sum + (parseInt(row.querySelector(`#qty-${catIdx}-${i}-${qq}`).value) || 0), 0);
          row.classList.toggle('active', total > 0);
          updateCount(catIdx, items.length);
        });
      });
    });

    section.appendChild(body);
    head.addEventListener('click', () => {
      body.classList.toggle('open');
      document.getElementById(`chev-${catIdx}`).classList.toggle('open');
    });

    main.appendChild(section);
  });

  function updateCount(catIdx, total){
    const activeRows = document.querySelectorAll(`#main .cat-section:nth-child(${catIdx+1}) .item-row.active`).length;
    const countEl = document.getElementById(`count-${catIdx}`);
    const barEl = document.getElementById(`bar-${catIdx}`);
    countEl.innerHTML = `<b>${activeRows}</b> / ${total}`;
    countEl.classList.toggle('done', activeRows >= total);
    const pct = Math.min(100, (activeRows/total)*100);
    barEl.style.width = pct + '%';
    barEl.classList.toggle('done', activeRows >= total);
  }
})();
</script>
</body>
</html>
